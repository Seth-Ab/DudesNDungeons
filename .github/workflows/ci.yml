name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

  e2e:
    name: E2E (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Playwright cuts the alphabetical test list into contiguous chunks, and the slowest specs
      # (bow, characterSprites, darkness, trainingDummies) sit close together, so equal chunks leave
      # shard 1 several times slower than shard 2. These weights are the chunks' relative sizes in
      # tests, chosen from a run's per-test times; recompute them if the shards drift apart.
      - name: Run e2e tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        env:
          PWTEST_SHARD_WEIGHTS: "3:17:15:13"

  # Single required check that gates on every job above, so branch protection keeps one stable name.
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    if: always()

    steps:
      - name: Require every job to pass
        run: |
          if [ "${{ needs.unit.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "unit: ${{ needs.unit.result }}, e2e: ${{ needs.e2e.result }}"
            exit 1
          fi
